name: Build Python version dependent wheels

on:
  workflow_call:
    inputs:
      supported_python_versions:
        description: 'JSON array of supported Python versions'
        required: true
        type: string
      oldest_supported_python:
        description: 'Oldest supported Python version to exclude from builds'
        required: true
        type: string

jobs:
  triage:
    name: ${{ matrix.os }} - ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PyO3 (cryptography, etc.): allow building against CPython newer than PyO3's declared max when using stable ABI
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    strategy:
      fail-fast: false
      matrix:
        os:
          - Windows
          - Linux x86_64
          - macOS Intel
          - macOS ARM
          - Linux ARM64
          - Linux ARMv7
          - Linux ARMv7 Legacy
        include:
          - os: Windows
            # VS 2022 / v143 required (bleak-winrt); windows-latest is VS 2026 from ~Jun 2026
            runner: windows-2022
            arch: windows-x86_64
          - os: Linux x86_64
            runner: ubuntu-latest
            arch: linux-x86_64
          - os: macOS Intel
            runner: macos-15-intel
            arch: macos-x86_64
          - os: macOS ARM
            runner: macos-latest
            arch: macos-arm64
          - os: Linux ARM64
            runner: ubuntu-24.04-arm
            arch: linux-arm64
          - os: Linux ARMv7
            runner: ubuntu-latest
            arch: linux-armv7
          - os: Linux ARMv7 Legacy
            runner: ubuntu-latest
            arch: linux-armv7legacy
        python-version: ${{ fromJson(inputs.supported_python_versions) }}
        exclude:
          # Exclude oldest supported Python since it's already built in the platform builds
          - python-version: ${{ inputs.oldest_supported_python }}
            os: Windows
          - python-version: ${{ inputs.oldest_supported_python }}
            os: Linux x86_64
          - python-version: ${{ inputs.oldest_supported_python }}
            os: macOS Intel
          - python-version: ${{ inputs.oldest_supported_python }}
            os: macOS ARM
          - python-version: ${{ inputs.oldest_supported_python }}
            os: Linux ARM64
          - python-version: ${{ inputs.oldest_supported_python }}
            os: Linux ARMv7
          - python-version: ${{ inputs.oldest_supported_python }}
            os: Linux ARMv7 Legacy
          # Python 3.14 doesn't have bullseye images for ARM
          - python-version: '3.14'
            os: Linux ARMv7 Legacy

    steps:
      - name: Set up QEMU for ARMv7
        if: matrix.os == 'Linux ARMv7' || matrix.os == 'Linux ARMv7 Legacy'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm/v7

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        # Skip setting python on ARMv7 (runs in Docker)
        if: matrix.os != 'Linux ARMv7' && matrix.os != 'Linux ARMv7 Legacy'
        uses: actions/setup-python@v6
        with:
            python-version: ${{ matrix.python-version }}

      - name: Get Python version
        if: matrix.os != 'Linux ARMv7' && matrix.os != 'Linux ARMv7 Legacy'
        run: |
            python --version
            python -m pip install --upgrade pip

      - name: Install dependencies
        if: matrix.os != 'Linux ARMv7' && matrix.os != 'Linux ARMv7 Legacy'
        run: python -m pip install -r build_requirements.txt

      - name: Install additional OS dependencies - Ubuntu
        if: matrix.os == 'Linux x86_64'
        run: os_dependencies/ubuntu.sh

      - name: Install additional OS dependencies - MacOS
        if: matrix.os == 'macOS ARM' || matrix.os == 'macOS Intel'
        run: os_dependencies/macos.sh

      - name: Install additional OS dependencies - Linux ARM64
        if: matrix.os == 'Linux ARM64'
        run: sudo bash os_dependencies/linux_arm.sh

      - name: Install additional OS dependencies - Windows
        if: matrix.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File os_dependencies/windows.ps1

      - name: Locate Visual Studio 2022
        if: matrix.os == 'Windows'
        id: vs2022
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -version "[17.0,18.0)" -latest -property installationPath
          if (-not $path) {
            throw "Visual Studio 2022 (17.x) not found on this runner."
          }
          Write-Host "Using Visual Studio at: $path"
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Enable MSVC developer environment
        if: matrix.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64
          # bleak-winrt (scikit-build) rejects MSVC 19.50 when probing VS 2022 generators
          vs-path: ${{ steps.vs2022.outputs.path }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dependent_requirements_${{ matrix.arch }}
          path: dependent_requirements_${{ matrix.arch }}

      # Stage-1 wheels seed find-links so obsolete merged pins (e.g. cryptography<43) are
      # skipped before pip falls back to sdists (ARMv7 has no manylinux wheels for old pins).
      - name: Download stage-1 wheel seed
        uses: actions/download-artifact@v8
        with:
          name: wheels-download-directory-${{ matrix.arch }}-${{ inputs.oldest_supported_python }}
          path: ./downloaded_wheels

      - name: Print requirements
        if: matrix.os != 'Windows'
        run: cat dependent_requirements_${{ matrix.arch }}/dependent_requirements.txt

      - name: Print requirements - Windows
        if: matrix.os == 'Windows'
        run: type dependent_requirements_${{ matrix.arch }}\\dependent_requirements.txt

      - name: Build Python dependent wheels - ARMv7 (in Docker)
        if: matrix.os == 'Linux ARMv7'
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v $(pwd):/work \
            -w /work \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e PIP_NO_CACHE_DIR=1 \
            -e PIP_INDEX_URL=https://www.piwheels.org/simple \
            -e PIP_EXTRA_INDEX_URL=https://pypi.org/simple \
            python:${{ matrix.python-version }}-bookworm \
            bash -c "
              set -e
              python --version
              source os_dependencies/linux_armv7_docker_prepare.sh
              # Install pip packages without cache to reduce memory usage
              python -m pip install --no-cache-dir --upgrade pip
              python -m pip install --no-cache-dir -r build_requirements.txt
              bash os_dependencies/linux_arm.sh
              # Source Rust environment after installation
              . \$HOME/.cargo/env
              python build_wheels_from_file.py --force-interpreter-binary dependent_requirements_${{ matrix.arch }}
            "

      - name: Build Python dependent wheels - ARMv7 Legacy (in Docker)
        # Build on Bullseye (glibc 2.31) for compatibility with older systems
        if: matrix.os == 'Linux ARMv7 Legacy'
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v $(pwd):/work \
            -w /work \
            -e PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 \
            -e GH_TOKEN="${GH_TOKEN}" \
            -e PIP_NO_CACHE_DIR=1 \
            -e PIP_INDEX_URL=https://www.piwheels.org/simple \
            -e PIP_EXTRA_INDEX_URL=https://pypi.org/simple \
            python:${{ matrix.python-version }}-bullseye \
            bash -c "
              set -e
              python --version
              source os_dependencies/linux_armv7_docker_prepare.sh
              # Install pip packages without cache to reduce memory usage
              python -m pip install --no-cache-dir --upgrade pip
              python -m pip install --no-cache-dir -r build_requirements.txt
              bash os_dependencies/linux_arm.sh
              # Source Rust environment after installation
              . \$HOME/.cargo/env
              python build_wheels_from_file.py --force-interpreter-binary dependent_requirements_${{ matrix.arch }}
            "

      - name: Build Python dependent wheels - Linux/macOS
        if: matrix.os != 'Windows' && matrix.os != 'Linux ARMv7' && matrix.os != 'Linux ARMv7 Legacy'
        run: |
            # Set ARCHFLAGS for macOS to prevent universal2 wheels
            if [ "${{ matrix.os }}" = "macOS ARM" ]; then
              export ARCHFLAGS="-arch arm64"
            elif [ "${{ matrix.os }}" = "macOS Intel" ]; then
              export ARCHFLAGS="-arch x86_64"
            fi

            python build_wheels_from_file.py --force-interpreter-binary dependent_requirements_${{ matrix.arch }}

      - name: Validate cryptography OpenSSL 4 wheels (macOS Intel)
        if: matrix.os == 'macOS Intel'
        run: bash scripts/validate_cryptography_macos_intel_wheel.sh ./downloaded_wheels

      - name: Build Python dependent wheels for ${{ matrix.python-version }} - Windows
        if: matrix.os == 'Windows'
        run: python build_wheels_from_file.py --force-interpreter-binary dependent_requirements_${{ matrix.arch }}

      - name: Fix permissions on downloaded_wheels (ARMv7 Docker builds)
        if: matrix.os == 'Linux ARMv7' || matrix.os == 'Linux ARMv7 Legacy'
        run: sudo chown -R $USER:$USER ./downloaded_wheels

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-download-directory-${{ matrix.arch }}-${{ matrix.python-version }}
          if-no-files-found: ignore
          path: ./downloaded_wheels
          retention-days: 1
