name: delete-pypi-index-artifact

on:
  workflow_dispatch:
    inputs:
      expected_artifact_count:
        description: >-
          Number of artifacts to delete. Must match manifest records.
          A dry run lists each object and fails if one is missing.
          A real run removes each key. aws s3 rm succeeds again if the object
          is already gone.
        type: number
        required: true
      artifacts:
        description: >-
          Artifact records separated by ';' or by newlines (newlines only survive
          `gh workflow run`, not the web form). Each record is
          package_name, exact_filename. The package name is the S3 directory
          under pypi/, lowercased but not otherwise rewritten.
          Records starting with # are ignored. Example:
          psutil,psutil-7.2.2-cp36-abi3-macosx_15_0_x86_64.whl; flake8,flake8-2020-1.8.0.tar.gz
        type: string
        required: true
      dry_run:
        description: When true, list each key only (no aws s3 rm).
        type: boolean
        required: false
        default: true
      regenerate_index:
        description: After a real delete, regenerate index pages.
        type: boolean
        required: false
        default: true

jobs:
  approve-delete:
    name: Approve PyPI index delete
    # Same main-only guard as the upload job. The workflow file comes from the
    # selected ref, so also restrict the pypi-index-delete environment's
    # deployment branches to main.
    # This job does not join pypi-s3-index and does not write S3. A run waiting
    # on a reviewer must not block wheel uploads. The delete job takes that
    # lock only after this job succeeds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi-index-delete
    steps:
      - name: Record approved delete
        env:
          EXPECTED_COUNT: ${{ inputs.expected_artifact_count }}
          DRY_RUN: ${{ inputs.dry_run }}
          REGENERATE_INDEX: ${{ inputs.regenerate_index }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          echo "Approved delete of ${EXPECTED_COUNT} artifact(s)."
          echo "dry_run=${DRY_RUN} regenerate_index=${REGENERATE_INDEX}"
          printf '%s\n' "$ARTIFACTS"

  delete-artifact:
    name: Delete PyPI index artifacts
    needs: approve-delete
    if: github.ref == 'refs/heads/main' && needs.approve-delete.result == 'success'
    concurrency:
      group: pypi-s3-index
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_BUCKET: ${{ secrets.DL_BUCKET }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: python -m pip install -r build_requirements.txt

      - name: Write delete manifest
        env:
          ARTIFACTS: ${{ inputs.artifacts }}
        run: printf '%s\n' "$ARTIFACTS" > delete-manifest.txt

      - name: Delete artifacts from S3 index
        env:
          EXPECTED_COUNT: ${{ inputs.expected_artifact_count }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python delete_index_artifact.py \
            --expected-count "$EXPECTED_COUNT" \
            --manifest delete-manifest.txt > keys.txt
          while IFS= read -r key; do
            [ -z "$key" ] && continue
            if [ "$DRY_RUN" = "true" ]; then
              aws s3 ls "s3://$AWS_BUCKET/$key"
            else
              aws s3 rm "s3://$AWS_BUCKET/$key"
            fi
          done < keys.txt

      - name: Create and upload Index to S3 bucket
        if: ${{ inputs.dry_run != true && inputs.regenerate_index == true }}
        run: |
          python create_index_pages.py $AWS_BUCKET

      - name: Drop AWS cache
        if: ${{ inputs.dry_run != true && inputs.regenerate_index == true }}
        id: invalidate-index-cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CACHE_INVALIDATION }} --paths "/pypi/*"
