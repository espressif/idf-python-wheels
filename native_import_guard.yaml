# Native import probes after pip install (test_wheels_install.py, every test-wheels-install runner).
# Does not change the requirements list.
#
# "After installing the wheel for package_name (on platform, for python, at version),
#  run imports — or skip — and fail CI if import crashes or errors."
#
# Top-level:
#   probe_unlisted   — probe unlisted platform wheels via one import from top_level.txt
#                      (default true; skipped when top_level.txt is missing — installs use --no-deps)
#   skip_pure_any    — skip *-none-any.whl (default true)
#   skip_top_level   — top_level.txt names ignored when generating default imports
#
# Each packages: entry (same filter tokens as exclude_list.yaml / include_list.yaml):
#   package_name  — PyPI distribution name (legacy key ``name`` is also accepted)
#   imports       — Python statement(s) in one subprocess (list; multiline allowed). Optional if skip.
#   skip          — true: do not probe when filters match (optional)
#   platform      — win32 | darwin | linux | linux_x86_64 | linux_arm64 | linux_armv7 |
#                   macos_x86_64 | macos_arm64 (string or list). Omitted = all platforms.
#   python        — python_version specifier(s), e.g. '>=3.10' or ['==3.8', '==3.9']
#   version       — package version specifier(s), e.g. '>=49' or ['>=1.0', '<2']
#   Unmatched filters treat the package as unlisted (probe_unlisted default import).
#   Use skip: true when a probe should not run.
#
# ``import cffi`` alone is not enough — a broken auditwheel manylinux tag can segfault only in _cffi_backend.

probe_unlisted: true
skip_pure_any: true
skip_top_level:
  - test
  - tests
  - testing

packages:
  - package_name: cffi
    imports:
      - import _cffi_backend
  - package_name: argon2-cffi-bindings
    imports:
      - from _argon2_cffi_bindings import _ffi
  - package_name: argon2-cffi
    imports:
      - import argon2
  - package_name: cryptography
    imports:
      - |
        try:
            from cryptography.hazmat.bindings._rust import openssl as _openssl
        except ImportError:
            from cryptography.hazmat.bindings._openssl import ffi
      - from cryptography import x509
      - print("cryptography import OK", x509.__name__)
  - package_name: bcrypt
    imports:
      - import bcrypt
  - package_name: pynacl
    imports:
      - import nacl.bindings
  - package_name: psutil
    imports:
      - import psutil
      - print("psutil import OK", psutil.__version__)
  # Linux --no-binary rebuilds: top-level import can succeed without loading the C extension.
  - package_name: pillow
    imports:
      - from PIL import Image
  - package_name: pyyaml
    imports:
      - from yaml import CSafeLoader
  - package_name: brotli
    imports:
      - import brotli
  - package_name: pycryptodome
    imports:
      - from Crypto.Cipher import AES
